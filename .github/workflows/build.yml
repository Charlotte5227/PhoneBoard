name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange binutils-mingw-w64-x86-64
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBoard
          path: dist/*
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/PhoneBoard.exe dist/PhoneBoard.apk --title "PhoneBoard ${GITHUB_REF_NAME}" --generate-notes
